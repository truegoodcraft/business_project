name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            lockfile: requirements-linux.lock.txt
          - os: windows-latest
            python-version: "3.11"
            lockfile: requirements-windows.lock.txt

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install locked runtime and test tooling
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install --require-hashes -r "${{ matrix.lockfile }}"
          python -m pip install "pytest==9.1.1"
          python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q core tgc scripts launcher.py

      - name: Run tests
        run: python -m pytest -q
